<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#B5281C">
<title>Lành · Quản lý bán hàng</title>
<link rel="icon" href="/quan-ly/icons/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/quan-ly/manifest.webmanifest">
<link rel="apple-touch-icon" href="/quan-ly/icons/apple-touch-icon.png">
<meta name="application-name" content="Lành Quản lý">
<meta name="apple-mobile-web-app-title" content="Lành Quản lý">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Dashboard Lành: bố cục theo tab Lành Gift của Sơn Nga Family (ô số, chọn chiến dịch, hộp ghi trượt lên), màu và chữ của Lành. */
:root{--do:#B5281C;--do-d:#8E1B12;--do-den:#4A0B07;--do-n:#FBE1D9;--do-nn:#FDF1EC;--giay:#F6EDDC;--kem:#FFFDF8;--kem2:#FBF5EA;--be:#EFE5D3;
  --muc:#2B1A12;--muc2:#4A3628;--nhat:#7A6656;--vien:rgba(43,26,18,.12);--vien2:rgba(43,26,18,.22);--kim:#D9A441;--kim-n:#FBEFD3;--kim-d:#7A5410;
  --la:#1F5A40;--la-n:#DCEFE2;--xanh:#1E4A7A;--xanh-n:#DDEBFA;--cam:#F28C1E;--bong:0 10px 28px rgba(74,11,7,.08);
  --f:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--ease:cubic-bezier(.32,.72,0,1)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--giay);color:var(--muc);font:400 15px/1.45 var(--f);min-height:100vh;min-height:100dvh}
body.lock{overflow:hidden}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--do);outline-offset:2px}
[hidden]{display:none!important}
.num,.tb td,.tl b{font-variant-numeric:tabular-nums}
.num{white-space:nowrap}
.xs{font-size:12.5px;color:var(--nhat);line-height:1.4}
.s{font-size:13.5px;color:var(--nhat)}
.grow{flex:1 1 auto;min-width:0}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pos{color:var(--la)}.neg{color:var(--do)}.warn{color:var(--kim-d)}

/* đầu trang */
.top{position:sticky;top:0;z-index:20;background:var(--do);color:var(--giay);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:12px}
.mark{width:34px;height:34px;border-radius:11px;background:var(--giay);display:grid;place-items:center;flex:0 0 auto}
.mark i{width:16px;height:16px;border-radius:50%;background:var(--cam);box-shadow:0 0 0 3px rgba(181,40,28,.18)}
.top h1{font-size:1.02rem;font-weight:800;flex:1;min-width:0}
.top h1 small{display:block;font-size:.72rem;font-weight:500;opacity:.82}
.ib{min-width:44px;height:44px;padding:0 12px;border-radius:999px;border:1.5px solid rgba(246,237,220,.4);background:transparent;color:inherit;font-weight:600;font-size:.84rem;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background-color .2s ease,transform .15s ease-out}
.ib:active{transform:scale(.96)}
@media (hover:hover){.ib:hover{background:rgba(246,237,220,.12)}}
.demo{background:var(--kim-n);color:var(--kim-d);font-size:13px;font-weight:600;text-align:center;padding:8px 16px;border-bottom:1px solid rgba(122,84,16,.18)}

.wrap{max-width:1200px;margin:0 auto;padding:14px 14px calc(48px + env(safe-area-inset-bottom))}
.app{display:flex;flex-direction:column;gap:14px}

/* tab và chọn chiến dịch */
.nav{display:flex;flex-direction:column;gap:10px}
.tabs{display:flex;gap:6px;padding:5px;background:var(--kem);border-radius:999px;box-shadow:var(--bong);border:1px solid var(--vien);overflow-x:auto;scrollbar-width:none;align-self:flex-start;max-width:100%}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;min-height:42px;padding:0 16px;border-radius:999px;border:0;background:transparent;font-weight:700;font-size:14px;color:var(--muc2);white-space:nowrap;transition:background-color .2s ease,color .2s ease}
.tab[aria-current="page"]{background:var(--do);color:var(--kem)}
.tab .sm{display:none}
@media (max-width:560px){.tabs{align-self:stretch;display:grid;grid-template-columns:repeat(4,auto);justify-content:space-between}.tab{padding:0 10px;font-size:14px;justify-content:center}.tab .lg{display:none}.tab .sm{display:inline}}
.tab .n{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--do-n);color:var(--do-d);font-size:11.5px;font-weight:800;display:inline-grid;place-items:center}
.tab[aria-current="page"] .n{background:rgba(255,253,248,.22);color:var(--kem)}
.pick{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 4px}
.pick::-webkit-scrollbar{display:none}
.cp{flex:0 0 auto;display:flex;flex-direction:column;gap:2px;align-items:flex-start;min-height:48px;padding:8px 14px;border-radius:16px;border:1.5px solid var(--vien);background:var(--kem);text-align:left;transition:border-color .2s ease,box-shadow .2s ease}
.cp b{font-size:14px}
.cp[aria-pressed="true"]{border-color:var(--do);box-shadow:0 0 0 3px rgba(181,40,28,.12)}
.cp--add{border-style:dashed;border-color:rgba(181,40,28,.4);color:var(--do-d);justify-content:center}

/* thẻ */
.cd{background:var(--kem);border:1px solid var(--vien);border-radius:22px;box-shadow:var(--bong);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hd h3{font-size:16px;font-weight:800}
.cap{font-size:11.5px;font-weight:800;letter-spacing:.06em;color:var(--nhat);text-transform:uppercase}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;min-width:0}
.g2{display:grid;gap:14px}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (min-width:980px){.g2{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);align-items:start}}

/* nút */
.b{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 18px;border-radius:999px;border:1.5px solid transparent;font-weight:700;font-size:14.5px;text-decoration:none;white-space:nowrap;transition:transform .15s ease-out,background-color .2s ease,border-color .2s ease}
.b:active:not(:disabled){transform:scale(.96)}
.b:disabled{opacity:.55;cursor:not-allowed}
.b--do{background:var(--do);color:var(--kem);box-shadow:0 3px 0 var(--do-den)}
.b--o{background:#fff;border-color:var(--vien2);color:var(--muc)}
.b--g{background:transparent;color:var(--do-d);padding:0 10px}
.b--la{background:var(--la);color:#fff}
.b--sm{min-height:40px;padding:0 14px;font-size:13.5px}
.b--w{width:100%}
.b.is-busy{opacity:.7;pointer-events:none}
@media (hover:hover){.b--o:hover{border-color:var(--do)}.b--do:hover{background:var(--do-d)}}
.x{width:44px;height:44px;border-radius:50%;border:0;background:var(--be);display:grid;place-items:center;flex:0 0 auto}

/* nhãn */
.tg{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--be);color:var(--muc2)}
.tg--src{background:var(--kem2);border:1px solid var(--vien)}
.tg--warn{background:var(--kim-n);color:var(--kim-d)}
.tg--pos{background:var(--la-n);color:var(--la)}
.tg--neg{background:var(--do-n);color:var(--do-d)}
.st-moi{background:#FBE1D9;color:#8E1B12}
.st-da-xac-nhan{background:#FFF0C9;color:#7A5410}
.st-dang-giao{background:#DDEBFA;color:#1E4A7A}
.st-da-giao{background:#E4ECEF;color:#2F5566}
.st-da-nhan-tien{background:#DCEFE2;color:#1F5A40}
.st-huy{background:#E8E2DA;color:#5A4636}
.st-hoan-hang{background:#F3DADA;color:#7A1F1F}
.cs-draft{background:#EDE6DA;color:#5A4636}
.cs-running{background:var(--do);color:var(--kem)}
.cs-closed{background:var(--kim-n);color:var(--kim-d)}
.cs-settled{background:var(--la-n);color:var(--la)}

/* tổng quan */
.hero{flex-direction:row;align-items:center;gap:16px;flex-wrap:wrap;background:linear-gradient(115deg,#FFFDF8 0%,#FBF1DF 60%,#F6DED0 100%)}
.hero__ic{width:58px;height:58px;border-radius:18px;background:var(--do);color:var(--kem);display:grid;place-items:center;flex:0 0 auto}
.hero h2{font-size:24px;font-weight:800;line-height:1.15}
.hero__t{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:4px}
.hero__t .r1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hero__b{display:flex;gap:8px;flex-wrap:wrap}
.todo{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.td{display:flex;align-items:center;gap:12px;min-height:58px;padding:10px 14px;border-radius:16px;border:1.5px solid var(--vien);background:var(--kem);text-align:left;transition:border-color .2s ease}
.td b{font-size:22px;font-weight:800;min-width:26px;color:var(--do)}
.td{line-height:1.3}
.td span{font-size:13.5px;font-weight:600;color:var(--muc2)}
.td--warn{background:var(--kim-n);border-color:rgba(122,84,16,.25)}
.td--warn b{color:var(--kim-d)}
.td--ok{background:var(--la-n);border-color:transparent;cursor:default}
.td--ok b{color:var(--la)}
@media (hover:hover){.td:not(.td--ok):hover{border-color:var(--do)}}
.k4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:760px){.k4{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}}
.tl{padding:14px 16px;border-radius:18px;background:#fff;border:1.5px solid #EADFCB;display:flex;flex-direction:column;gap:5px;min-width:0}
.tl b{font-size:22px;font-weight:800;line-height:1.15}
@media (min-width:760px){.tl b{font-size:25px}}
.tl--do{background:var(--do-nn);border-color:#F1C3B5}.tl--do .cap,.tl--do b{color:var(--do-d)}
.tl--la{background:#F1F8F3;border-color:#BFE0CB}.tl--la .cap,.tl--la b{color:var(--la)}
.bar{height:8px;border-radius:99px;background:var(--be);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar--l{height:12px}

/* bảng kế hoạch và thực tế: lưới, trên điện thoại tên khoản lên một dòng riêng */
.pt{display:flex;flex-direction:column}
.pt>div{display:grid;grid-template-columns:minmax(0,1.5fr) repeat(3,minmax(0,1fr));gap:8px;align-items:center;padding:11px 4px;border-bottom:1px solid rgba(43,26,18,.07);font-size:14px}
.pt>div>span:not(:first-child){text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pt__h{font-size:12px!important;font-weight:800;color:var(--nhat);border-bottom:1.5px solid var(--vien)!important;padding-top:4px!important;padding-bottom:8px!important}
.pt small{display:block;font-size:12px;color:var(--nhat)}
.pt .tot{font-weight:800;border-bottom:0}
@media (max-width:560px){.pt>div{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:4px}.pt>div>span:first-child{grid-column:1/-1}.pt__h>span:first-child{display:none}.pt>div{font-size:13.5px}.pt small{display:inline;margin-left:6px}}
/* bảng */
.scroll{overflow-x:auto;margin:0 -4px;padding:0 4px}
.tb{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
.tb th{font-size:12px;font-weight:800;color:var(--nhat);text-align:right;padding:8px 10px;border-bottom:1.5px solid var(--vien);white-space:nowrap}
.tb td{padding:11px 10px;border-bottom:1px solid rgba(43,26,18,.07);text-align:right;white-space:nowrap}
.tb th:first-child,.tb td:first-child{text-align:left;white-space:normal}
.tb td small{display:block;font-size:12px;color:var(--nhat)}
.tb tr.tot td{font-weight:800;border-bottom:0}
.tb tbody tr[data-camp]{cursor:pointer}
@media (max-width:560px){.tb{font-size:13px}.tb th,.tb td{padding:9px 6px}}
.lr{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 12px;border-radius:16px;background:var(--kem2);width:100%;border:0;text-align:left}
button.lr{transition:background-color .2s ease}
@media (hover:hover){button.lr:hover{background:var(--be)}}
.dt{width:44px;height:44px;border-radius:12px;background:#fff;border:1px solid var(--vien);display:inline-flex;flex-direction:column;align-items:center;justify-content:center;flex:0 0 auto;line-height:1.05}
.dt b{font-size:15px}.dt small{font-size:11px;color:var(--nhat)}
.lst{display:flex;flex-direction:column;gap:8px}
.ph{display:none}
@media (max-width:560px){.ph{display:flex}.pc{display:none}}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px}
.leg span{font-size:12.5px;color:var(--muc2)}
.leg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.setr{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:16px;background:var(--kem2)}
.goal{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:16px;border:1.5px dashed rgba(181,40,28,.35)}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--kim-n);color:var(--kim-d);font-size:13.5px}
.note--do{background:var(--do-nn);color:var(--do-d)}
.note .b{margin-top:6px}

/* đơn hàng */
.ob__top{display:flex;gap:8px;flex-wrap:wrap}
.ob__top input,.ob__top select{height:44px;border-radius:12px;border:1.5px solid var(--vien2);background:#fff;padding:0 12px;font-size:16px;min-width:0}
.ob__top input{flex:1 1 220px}
.ob__top select{flex:0 1 180px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
@media (max-width:560px){#ofil{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px}#ofil::-webkit-scrollbar{display:none}}
.olf{display:flex;justify-content:center}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--vien);background:#fff;font-weight:600;font-size:13.5px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:background-color .2s ease,color .2s ease}
.chip i{font-style:normal;opacity:.65;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--muc);border-color:var(--muc);color:var(--giay)}
.ol{display:grid;gap:10px}
@media (min-width:980px){.ol{grid-template-columns:repeat(2,minmax(0,1fr))}}
.od{background:var(--kem);border:1px solid var(--vien);border-radius:18px;display:flex;flex-direction:column;min-width:0}
.od.is-new{border-color:var(--do);box-shadow:0 0 0 3px rgba(181,40,28,.12)}
.od.st-huy{opacity:.66}
.od__main{display:flex;flex-direction:column;gap:5px;padding:14px 16px 10px;border:0;background:transparent;text-align:left;width:100%;border-radius:18px 18px 0 0}
.od__h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.od__code{font-weight:800;letter-spacing:.03em}
.od__h .tg{margin-left:auto}
.od__set{font-weight:700;font-size:15px;display:flex;justify-content:space-between;gap:10px}
.od__set b{color:var(--do);white-space:nowrap}
.od__who{font-size:13.5px;color:var(--muc2)}
.od__meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.od__acts{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 14px}
.empty{padding:36px 16px;text-align:center;color:var(--nhat)}

/* hộp ghi (trượt lên trên điện thoại, giữa màn hình trên máy tính) */
#sheet-root{position:fixed;inset:0;z-index:40;pointer-events:none}
#sheet-root:empty{display:none}
.ov{position:absolute;inset:0;background:rgba(43,26,18,.44);opacity:0;transition:opacity .3s ease}
.sh{position:absolute;left:0;right:0;bottom:0;max-height:92vh;max-height:92dvh;background:var(--kem);border-radius:24px 24px 0 0;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .45s var(--ease);box-shadow:0 -10px 40px rgba(43,26,18,.18)}
#sheet-root.on{pointer-events:auto}
#sheet-root.on .ov{opacity:1}
#sheet-root.on .sh{transform:translateY(0)}
@media (min-width:760px){
  .sh{left:50%;right:auto;bottom:auto;top:50%;width:min(640px,94vw);max-height:88vh;border-radius:24px;transform:translate(-50%,-47%) scale(.98);opacity:0;transition:transform .25s var(--ease),opacity .2s ease}
  #sheet-root.on .sh{transform:translate(-50%,-50%);opacity:1}
  .grab{display:none!important}
}
.sh__h{padding:10px 18px 12px;border-bottom:1px solid var(--vien);display:flex;flex-direction:column;gap:8px}
.grab{width:42px;height:5px;border-radius:99px;background:var(--vien2);align-self:center}
.sh__hr{display:flex;align-items:center;gap:12px}
.sh__hr h2{font-size:19px;font-weight:800}
.sh__b{padding:16px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:16px;overscroll-behavior:contain}
.sh__f{padding:12px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--vien);display:flex;flex-direction:column;gap:8px;background:var(--kem)}
.fl{display:flex;flex-direction:column;gap:7px;min-width:0}
.fl>span:first-child{font-size:13px;font-weight:700;color:var(--muc2);display:flex;justify-content:space-between;gap:8px}
.fl>span:first-child small{font-weight:500;color:var(--nhat)}
.in{width:100%;min-height:48px;padding:0 14px;border-radius:14px;border:1.5px solid var(--vien2);background:#fff;font-size:16px}
textarea.in{padding:12px 14px;min-height:76px;resize:vertical}
select.in{appearance:auto}
.in:focus{outline:none;border-color:var(--do);box-shadow:0 0 0 3px rgba(181,40,28,.12)}
.in:disabled{background:var(--kem2);color:var(--nhat)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
.seg{display:grid;gap:4px;padding:4px;border-radius:14px;background:var(--be)}
.seg button{min-height:42px;border-radius:11px;border:0;background:transparent;font-weight:700;font-size:13.5px;color:var(--muc2);padding:0 6px}
.seg button[aria-pressed="true"]{background:#fff;color:var(--do-d);box-shadow:0 2px 8px rgba(43,26,18,.12)}
.seg button[disabled]{color:var(--nhat);opacity:.55;cursor:not-allowed}
/* 2B: vốn, yêu cầu vốn, đồng bộ Sơn Nga */
.k3{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@media (min-width:640px){.k3{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}}
.tl--kim{background:var(--kim-n);border-color:#EBCF8F}.tl--kim .cap,.tl--kim b{color:var(--kim-d)}
.box--be{background:var(--kem2);border-color:transparent;gap:6px}
.box--la{background:#F1F8F3;border-color:#BFE0CB;gap:4px}
.kvr{display:flex;justify-content:space-between;gap:12px;font-size:13.5px}.kvr span{color:var(--nhat)}
.kvr--do{padding-top:6px;border-top:1px dashed var(--vien2)}.kvr--do span,.kvr--do b{color:var(--do-d)}
.ck{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 12px;border-radius:14px;border:1.5px solid var(--vien);background:#fff;font-size:14px}
.ck input{width:20px;height:20px;accent-color:var(--do);flex:0 0 auto}
.lr--req{flex-wrap:wrap}.lr--do{background:var(--do-nn)}.lr--do .xs{color:var(--do-d)}.lr--kim{background:var(--kim-n)}.lr--kim .xs{color:var(--kim-d)}
.tg--la,.rq-da-duyet{background:var(--la-n);color:var(--la)}.rq-cho-duyet{background:var(--kim-n);color:var(--kim-d)}
.rq-tu-choi{background:var(--do-n);color:var(--do-d)}.rq-huy{background:var(--be);color:var(--nhat)}
.itr{display:grid;grid-template-columns:minmax(0,1fr) 116px 128px;gap:8px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--kem2);border:1.5px solid transparent}
.itr.on{border-color:var(--do);background:var(--do-nn)}
.itr .in{min-height:44px;font-size:15px;padding:0 10px}
@media (max-width:520px){.itr{grid-template-columns:minmax(0,1fr) 120px}.itr .in{grid-column:1}.itr .stp{grid-row:1/3;grid-column:2}}
.stp{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;height:44px;border-radius:12px;border:1.5px solid var(--vien2);background:#fff;overflow:hidden}
.stp button{height:100%;border:0;background:transparent;font-size:20px;font-weight:700;color:var(--do-d)}
.stp input{border:0;text-align:center;font-weight:800;font-size:16px;min-width:0;background:transparent;height:100%}
.sum{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--do-nn)}
.sum>b{font-size:22px;color:var(--do-d);font-weight:800;white-space:nowrap}
.flow{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.flow li{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--nhat);text-align:center;position:relative}
.flow i{width:14px;height:14px;border-radius:50%;background:var(--be);border:2px solid var(--be);position:relative;z-index:1}
.flow li::before{content:"";position:absolute;top:6px;left:-50%;right:50%;height:2px;background:var(--be)}
.flow li:first-child::before{display:none}
.flow li.done i{background:var(--la);border-color:var(--la)}
.flow li.done::before,.flow li.cur::before{background:var(--la)}
.flow li.cur i{background:#fff;border-color:var(--do);box-shadow:0 0 0 4px rgba(181,40,28,.15)}
.flow li.cur{color:var(--do-d)}
.box{display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:18px;background:#fff;border:1px solid var(--vien)}
.box--do{background:var(--do-nn);border-color:#F1C3B5}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv a{color:var(--do-d);font-weight:700}
.kv dt{color:var(--nhat)}.kv dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
details.more>summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--do-d);min-height:44px;display:flex;align-items:center;list-style:none}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"";width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);margin-right:10px;transition:transform .2s ease}
details.more[open]>summary::before{transform:rotate(45deg)}
.err{color:var(--do);font-size:13.5px;font-weight:600}
.err:empty{display:none}
.csr{display:grid;grid-template-columns:minmax(0,1fr) 120px 100px 44px;gap:8px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--kem2)}
.csr .in{min-height:44px;font-size:15px;padding:0 10px}
@media (max-width:560px){.csr{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 44px}.csr [name=s_name]{grid-column:1/3;grid-row:1}.csr [data-rm]{grid-column:3;grid-row:1}.csr [name=s_price]{grid-column:1;grid-row:2}.csr [name=s_qty]{grid-column:2;grid-row:2}}
.srcr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.sw{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-size:13.5px;font-weight:600}
.sw input{width:20px;height:20px;accent-color:var(--do)}

/* đăng nhập, thông báo */
.login{max-width:380px;margin:12vh auto 0;padding:24px;background:var(--kem);border-radius:20px;border:1px solid var(--vien)}
.login h2{margin:0 0 6px;font-size:1.3rem}
.login p{margin:0 0 16px;color:var(--nhat);font-size:.9rem}
.login input{width:100%;height:50px;padding:0 14px;border-radius:12px;border:1.5px solid var(--vien2);background:#fff;font-size:16px;margin-bottom:10px}
.login input:focus{outline:none;border-color:var(--do)}
.login button{width:100%;height:52px;border:0;border-radius:999px;background:var(--do);color:var(--giay);font-weight:700;box-shadow:0 3px 0 var(--do-den)}
.login button:disabled{opacity:.7}
.login .err{margin:6px 0 0;min-height:1.2em}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;background:var(--muc);color:var(--giay);padding:12px 18px;border-radius:14px;font-size:.9rem;font-weight:500;transition:opacity .25s ease,transform .3s var(--ease);pointer-events:none;z-index:60;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
body.lock .toast{bottom:auto;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-16px)}
body.lock .toast.on{transform:translate(-50%,0)}
.foot{font-size:12.5px;color:var(--nhat);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}.sh{transform:none!important}#sheet-root .sh{opacity:0}#sheet-root.on .sh{opacity:1}}
@media (min-width:760px) and (prefers-reduced-motion:reduce){#sheet-root .sh{transform:translate(-50%,-50%)!important}}

/* App trên điện thoại (28/11/2026): cài lên màn hình chính, thanh điều hướng dưới, nút Ghi đơn nổi, kéo xuống để tải lại */
html{-webkit-tap-highlight-color:transparent;background:linear-gradient(var(--do) 50%,var(--giay) 50%)}
button,a,label{touch-action:manipulation}
.mark{overflow:hidden}
.mark svg{width:30px;height:30px;display:block}
.ib--i{width:44px;padding:0}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.ib.spin svg,.ptr.spin svg{animation:rf .8s linear infinite}
@keyframes rf{to{transform:rotate(360deg)}}
.lo{display:none;margin:4px auto 0;min-height:44px;padding:0 16px;border:0;background:none;color:var(--nhat);font-weight:600;font-size:13.5px;text-decoration:underline;text-underline-offset:3px}
.ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 58px);z-index:19;width:40px;height:40px;margin-left:-20px;border-radius:50%;background:var(--kem);box-shadow:0 6px 18px rgba(74,11,7,.18);display:grid;place-items:center;color:var(--nhat);opacity:0;transform:translateY(calc(var(--p,0) * 1px - 44px)) rotate(calc(var(--p,0) * 4deg));pointer-events:none}
.ptr.on{opacity:1}
.ptr.go{color:var(--do)}
.ptr.spin{opacity:1;color:var(--do);transform:translateY(20px);transition:transform .2s var(--ease)}
.ptr svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.bn{display:none}
@media (max-width:759px){
  .tabs{display:none}
  .top{padding:calc(8px + env(safe-area-inset-top)) 14px 8px;gap:10px}
  .top h1{font-size:.98rem}
  #out{display:none!important}
  .lo{display:block}
  .wrap{padding-bottom:calc(104px + env(safe-area-inset-bottom))}
  .bn{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end;padding:4px 4px calc(4px + env(safe-area-inset-bottom));background:rgba(255,253,248,.94);-webkit-backdrop-filter:saturate(1.5) blur(18px);backdrop-filter:saturate(1.5) blur(18px);border-top:1px solid var(--vien);box-shadow:0 -6px 22px rgba(74,11,7,.07);transition:transform .25s var(--ease);-webkit-user-select:none;user-select:none}
  .bn button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;min-height:56px;padding:5px 0 4px;border:0;background:none;color:var(--nhat);font-size:11.5px;font-weight:700;letter-spacing:.01em}
  .bn__ic{width:56px;height:30px;border-radius:999px;display:grid;place-items:center;transition:background-color .2s ease,transform .15s ease-out}
  .bn svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .bn [aria-current="page"]{color:var(--do-d)}
  .bn [aria-current="page"] .bn__ic{background:var(--do-n)}
  .bn button:active .bn__ic{transform:scale(.92)}
  .bn__add{color:var(--do)!important}
  .bn__add .bn__ic{width:56px;height:56px;margin-top:-22px;border-radius:50%;background:var(--do);color:var(--giay);box-shadow:0 8px 18px rgba(181,40,28,.32),0 0 0 4px var(--kem)}
  .bn__add svg{width:26px;height:26px;stroke-width:2.4}
  .bn__add[aria-disabled="true"]{color:var(--nhat)!important}
  .bn__add[aria-disabled="true"] .bn__ic{background:#CDBBA6;box-shadow:0 0 0 4px var(--kem)}
  .bn .n{position:absolute;top:3px;left:calc(50% + 7px);min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--do);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;box-shadow:0 0 0 2px var(--kem);font-variant-numeric:tabular-nums}
  .bn button:focus-visible{outline:none}
  .bn button:focus-visible .bn__ic{outline:2px solid var(--do);outline-offset:2px}
  body.kb .bn{transform:translateY(115%)}
  .toast{bottom:calc(88px + env(safe-area-inset-bottom))}
  .sh{max-height:calc(100dvh - env(safe-area-inset-top) - 10px)}
}
@media (display-mode:standalone){body{overscroll-behavior-y:none}}
@media print{.bn,.ptr{display:none}}
</style>

<header class="top">
  <span class="mark" aria-hidden="true"><svg viewBox="0 0 512 512"><g transform="translate(256 278) scale(1.25) translate(-256 -278)"><rect x="150" y="262" width="212" height="164" rx="22" fill="#B5281C"/><rect x="236" y="262" width="40" height="164" fill="#F4B223"/><rect x="130" y="206" width="252" height="70" rx="22" fill="#D23A22"/><rect x="236" y="206" width="40" height="70" fill="#F7C548"/><path d="M256 206 C214 140 150 140 160 182 C168 214 222 212 256 206 Z M256 206 C298 140 362 140 352 182 C344 214 290 212 256 206 Z" fill="#F4B223" stroke="#C98A22" stroke-width="12" stroke-linejoin="round"/></g></svg></span>
  <h1>Lành · Quản lý bán hàng<small id="sync">Đang tải…</small></h1>
  <button class="ib" id="bell" type="button" hidden>Bật báo đơn</button>
  <button class="ib ib--i" id="rf" type="button" aria-label="Tải lại số liệu" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg></button>

<div class="demo" id="demo" hidden>Số liệu minh hoạ, không phải đơn thật. Thao tác chỉ lưu trên máy này tới khi tải lại trang.</div>
<main class="wrap">
  <form class="login" id="login" hidden>
    <h2>Trang quản lý của Lành</h2>

    <input id="pass" type="password" autocomplete="current-password" placeholder="Mã quản lý" aria-label="Mã quản lý">
